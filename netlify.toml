[build]
    command = "deno upgrade && deno task build"
    publish = "dist"

[dev]
    command = "deno task serve"
    targetPort = 3000
    port = 8888
    framework = "#custom"

[[edge_functions]]
    path = "/api/collage-proxy"
    function = "collage-proxy"

[[headers]]
    for = "/*"
    [headers.values]
        X-Frame-Options = "DENY"
        X-Content-Type-Options = "nosniff"
        Referrer-Policy = "strict-origin-when-cross-origin"
        Permissions-Policy = "browsing-topics=(), attribution-reporting=(), run-ad-auction=(), join-ad-interest-group=()"
        Content-Security-Policy = "default-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://webmention.io https://avatars.webmention.io https://*.basemaps.cartocdn.com; connect-src 'self' https://webmention.io https://*.basemaps.cartocdn.com; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
    for = "/assets/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
    for = "/sw.js"
    [headers.values]
        Cache-Control = "max-age=0, no-cache, no-store, must-revalidate"
        Service-Worker-Allowed = "/"

[[headers]]
    for = "/manifest.json"
    [headers.values]
        Content-Type = "application/manifest+json"
        Cache-Control = "public, max-age=604800"

[[headers]]
    for = "/events.ics"
    [headers.values]
        Content-Type = "text/calendar; charset=utf-8"
        Content-Disposition = "attachment; filename=\"events.ics\""
        Cache-Control = "no-cache"

[[headers]]
    for = "/.well-known/webfinger"
    [headers.values]
        Content-Type = "application/jrd+json"
        Access-Control-Allow-Origin = "*"

[[headers]]
    for = "/.well-known/matrix/*"
    [headers.values]
        Content-Type = "application/json"
        Access-Control-Allow-Origin = "*"

[[redirects]]
    from = "https://rcucnw5pfx25wcc8xp4c28w359bsk74mdgy8u.netlify.app/*"
    to = "https://ege.celikci.me/:splat"
    status = 301
    force = true

[[redirects]]
    from = "https://celikci.me/*"
    to = "https://ege.celikci.me/:splat"
    status = 301

[[redirects]]
    from = "/event"
    to = "/events/"
    status = 301

[[redirects]]
    from = "/event/"
    to = "/events/"
    status = 301

[[redirects]]
    from = "https://ege.celikci.me/notes/20251201173255"
    to = "https://ege.celikci.me/notes/20251201143255"
    status = 302
    force = true

# Bots
[[redirects]]
    from = "/wp-login.php"
    to = "https://www.fbi.gov"
    status = 302
    force = true

# Favicon
[[redirects]]
    from = "/assets/images/touch/*"
    to = "/assets/images/favicon/:splat"
    status = 301
    force = true

# 404s
[[redirects]]
    from = "*"
    to = "/404.html"
    status = 404
