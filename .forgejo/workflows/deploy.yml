name: deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install git-lfs
        run: |
          if ! command -v git-lfs >/dev/null 2>&1; then
            curl -sL https://github.com/git-lfs/git-lfs/releases/download/v3.7.1/git-lfs-linux-amd64-v3.7.1.tar.gz \
              | tar -xz -C /tmp
            install /tmp/git-lfs-3.7.1/git-lfs /usr/local/bin/
          fi
          git lfs install

      - name: Clone repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Get week
        id: week
        run: echo "week=$(/bin/date -u +%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Lume resources
        uses: actions/cache@v6
        with:
          path: _cache
          key: _cache-${{ steps.week.outputs.week }}
          restore-keys: _cache-

      - name: Setup Deno
        uses: https://github.com/denoland/setup-deno@v2
        with:
          cache: true
          deno-version: 2.9.2

      - name: Prepare node_modules
        run: deno cache --node-modules-dir=auto npm:serwist@9.5.12 npm:esbuild@0.28.1

      - name: Build site
        run: deno task build
        env:
          CRITIQUEBRAINZ_ID: ${{ secrets.CRITIQUEBRAINZ_ID }}
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}

      - name: Deploy to Netlify
        run: npx netlify-cli deploy --prod --dir=dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
